[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "torch-xdna"
version = "0.1.0"
description = "torch.compile backend running model GEMMs on the AMD XDNA NPU via Triton-XDNA, the rest on the CPU"
requires-python = ">=3.10"
dependencies = ["torch>=2.5"]

[project.entry-points.torch_dynamo_backends]
xdna = "torch_xdna.backend:xdna_backend"

[tool.setuptools]
packages = ["torch_xdna"]
